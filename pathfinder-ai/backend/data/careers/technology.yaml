# Career definitions — technology family.
# skills: {skill_id: [target_level 1-3, importance core|important|useful]}
# signals: how interests/activities/work styles relate to the career (used for discovery).
# phases (optional): career-specific roadmap skeleton; skills not listed are placed automatically.

- id: software-engineer
  name: Software Engineer
  family: technology
  categories: [technology, engineering]
  summary: Design, build and maintain software systems that people and businesses rely on.
  what_they_do: Software engineers turn requirements into reliable, maintainable code. They design components, write and review code, test it, and keep systems running as they grow.
  responsibilities:
    - Design and implement features across the stack or within a focused area
    - Write tests and review teammates' code
    - Debug production issues and improve reliability
    - Collaborate with product and design on scope and trade-offs
  skills:
    python: [2, important]
    java: [2, useful]
    typescript: [2, useful]
    dsa: [2, core]
    git: [2, core]
    apis: [2, core]
    databases: [2, core]
    testing: [2, core]
    system_design: [2, important]
    linux: [2, important]
    docker: [1, useful]
    ci_cd: [1, useful]
    communication: [1, useful]
  technologies: [Git, Linux, PostgreSQL, Docker, a cloud platform, one backend framework]
  entry_routes:
    - Computer science or related degree plus internships
    - Bootcamp or self-taught path with a strong portfolio of shipped projects
    - Internal transfer from QA, support or IT roles
  example_projects: [A full-stack app with real users, An open-source contribution, A CLI tool solving a real workflow]
  project_templates: [fullstack-web-app, k8s-microservices, technical-docs-site]
  certificates: [aws-cloud-practitioner, ckad]
  related: [web-developer, ai-engineer, devops-engineer, data-engineer, mobile-developer]
  who_might_enjoy:
    - People who like building things and seeing them work
    - People who enjoy breaking problems into precise steps
    - People comfortable with continual learning as tools change
  questions_to_explore:
    - Do you prefer user-facing features or infrastructure behind the scenes?
    - How do you feel about debugging for hours to find one small cause?
    - Would you rather go deep in one language/stack or stay broad?
  signals:
    domains: {technology: 1.0, engineering: 0.8}
    activities: [building, problem_solving, technology]
    work_styles: [build_software, create_products]
  skill_focus: Writing reliable, maintainable software
  typical_outputs: Features, services, libraries, code reviews, design docs
  phases:
    - {name: Foundations, skills: [python, git, linux, dsa]}
    - {name: Building Software, skills: [apis, databases, testing]}
    - {name: Systems, skills: [system_design, docker, ci_cd]}

- id: ai-engineer
  name: AI Engineer
  family: technology
  categories: [technology, ai]
  summary: Build intelligent systems using ML, LLMs and AI infrastructure.
  what_they_do: AI engineers build products and internal tools powered by machine learning and large language models — combining models, retrieval, agents and APIs into systems that are evaluated, deployed and monitored.
  responsibilities:
    - Build LLM-powered features such as RAG, agents and structured extraction
    - Train, fine-tune or integrate ML models where they add value
    - Design evaluations to measure quality, safety and regressions
    - Deploy AI services with attention to latency, cost and reliability
    - Work with product teams to scope what AI can realistically do
  skills:
    python: [3, core]
    machine_learning: [3, core]
    deep_learning: [2, important]
    llms: [3, core]
    rag: [2, core]
    ai_agents: [2, core]
    prompt_engineering: [2, important]
    llm_evaluation: [2, important]
    apis: [2, core]
    vector_databases: [2, important]
    sql: [2, important]
    git: [2, important]
    docker: [2, important]
    model_deployment: [2, important]
    cloud: [2, important]
    mlops: [1, useful]
    statistics: [1, useful]
  technologies: [Python, PyTorch, LangChain / LangGraph, Qdrant or pgvector, FastAPI, Docker, AWS/GCP/Azure, OpenAI / Gemini / open models]
  entry_routes:
    - Software engineers adding ML and LLM skills
    - Data scientists moving toward production systems
    - Graduates with strong, deployed AI projects
  example_projects: [RAG assistant with citations and evals, Multi-tool agent with tracing, Deployed model API with monitoring]
  project_templates: [rag-knowledge-assistant, agentic-research-assistant, agentic-customer-intelligence, production-ml-api, financial-ai-analyst]
  certificates: [aws-ml-engineer-associate, azure-ai-engineer, gcp-professional-ml-engineer, nvidia-genai-llm-associate, dlai-deep-learning-specialization]
  related: [ml-engineer, genai-engineer, mlops-engineer, data-scientist, software-engineer]
  who_might_enjoy:
    - Builders who enjoy fast-moving technology
    - People who like combining research ideas with practical engineering
    - People comfortable with systems that are probabilistic, not deterministic
  questions_to_explore:
    - Are you more excited by building products or by improving models themselves?
    - How comfortable are you with rapid change in tools and best practices?
    - Do you enjoy measuring quality rigorously, not just demoing?
  signals:
    domains: {ai: 1.0, technology: 0.8, data: 0.4}
    activities: [building, problem_solving, technology, researching]
    work_styles: [build_software, research_technology, create_products, work_with_data]
  skill_focus: Building and shipping AI-powered systems
  typical_outputs: LLM features, RAG pipelines, agents, model APIs, evaluation suites
  phases:
    - {name: Foundations, skills: [python, sql, git, apis]}
    - {name: Machine Learning, skills: [statistics, machine_learning, deep_learning]}
    - {name: Generative AI, skills: [llms, prompt_engineering, vector_databases, rag, ai_agents, llm_evaluation]}
    - {name: Production AI, skills: [docker, model_deployment, cloud, mlops]}

