    - {name: "Dense/semantic retrieval", keywords: [dense, embedding, semantic, vector]}
    - {name: "Complementary strengths", keywords: [exact, synonym, rare, complement, paraphrase]}
    - {name: "Fusion (e.g. Reciprocal Rank Fusion)", keywords: [rrf, reciprocal rank, fusion, fuse, merge]}
    - {name: "Reranking", keywords: [rerank, cross-encoder, cross encoder]}
  follow_ups:
    - Why is RRF robust to score scale differences between retrievers?
    - When would a cross-encoder reranker be too slow?

