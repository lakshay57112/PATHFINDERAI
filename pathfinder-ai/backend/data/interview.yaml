# Interview question bank. Questions are selected by the user's target career skills and mode.
# concepts: what a strong answer covers; keywords are used by the offline rubric
# (the LLM rubric uses the concept names directly).

# ------------------------------------------------------------------ technical
- id: rag-how
  mode: technical
  skills: [rag]
  prompt: Explain how Retrieval-Augmented Generation (RAG) works, end to end.
  concepts:
    - {name: "Document ingestion and chunking", keywords: [chunk, split, ingest, document, parse]}
    - {name: "Embeddings and vector search", keywords: [embedding, vector, similarity, semantic, cosine]}
    - {name: "Retrieval of top-k context", keywords: [retrieve, retrieval, top-k, top k, relevant]}
    - {name: "Prompt augmentation with context", keywords: [context, prompt, augment, inject, grounding]}
    - {name: "Generation grounded in sources / citations", keywords: [cite, citation, source, ground, hallucin]}
    - {name: "Evaluation of retrieval and answers", keywords: [evaluat, recall, faithful, precision, metric]}
  follow_ups:
    - How would you improve retrieval quality when semantic search misses exact keyword matches?
    - How would you evaluate whether your RAG system's answers are faithful to the sources?
    - How do you choose chunk size and overlap?

- id: rag-hybrid
  mode: technical
