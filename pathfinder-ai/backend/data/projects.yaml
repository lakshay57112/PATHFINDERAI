  difficulty: intermediate
  hours: 40
  skills: [machine_learning, data_analysis, python, statistics]
  uses: [sql, data_visualization]
  domains: [data, ai, business]
  problem: A subscription business loses customers without warning and doesn't know who to help first.
  architecture: [Customer data, Feature pipeline, Baseline + gradient-boosted model, "Explainability (SHAP)", Retention recommendations]
  technologies: [Python, pandas, scikit-learn, XGBoost, SHAP]
  expected_output: A calibrated churn model with error analysis and a prioritised retention list.
  portfolio_value: A classic, well-understood ML problem that lets you show rigour in evaluation.
  flavors:
    finance: Predict credit-card customer attrition.
    healthcare: Predict patients likely to drop out of a care programme.

