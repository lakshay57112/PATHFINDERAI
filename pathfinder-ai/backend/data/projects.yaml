# Project templates. The recommendation engine personalises them: it picks templates that
# build evidence for a user's gaps, reuse their strengths, and (via `flavors`) sit in a
# domain they said they care about.

- id: sales-analytics-dashboard
  name: Sales Analytics Dashboard
  difficulty: beginner
  hours: 20
  skills: [sql, data_analysis, data_visualization, bi_tools]
  domains: [data, business]
  problem: Leaders can't see which products, regions and channels drive revenue, or why it moved last month.
  architecture: [Public sales dataset, SQL cleaning & modelling, Metric definitions, BI dashboard, Written insights]
  technologies: [PostgreSQL, SQL, Power BI or Tableau]
  expected_output: A dashboard with 5–7 defined KPIs plus a one-page insight memo.
  portfolio_value: Shows you can turn raw data into a decision tool non-technical people use.
  flavors:
    finance: Analyse revenue and margin by segment for a listed company's reported data.
    healthcare: Track appointment volume and no-show rates by clinic.
    marketing: Break revenue down by acquisition channel and campaign.

- id: customer-churn-prediction
