# PathFinder skill taxonomy.
# hours: estimated focused hours to reach [beginner, intermediate, advanced] from the previous level.
# learn: curated, well-known public resources. practice/build/prove: evidence-first guidance.
# onboarding: which picker group the skill appears in during onboarding (omit = not shown directly).

# ---------------------------------------------------------------- programming languages
- id: python
  name: Python
  category: programming
  domains: [technology, data, ai]
  onboarding: languages
  aliases: [python3, pandas, numpy, py]
  hours: [20, 50, 65]
  description: General-purpose language that dominates data, AI and automation work.
  learn:
    - {title: The Python Tutorial, provider: Python Software Foundation, url: "https://docs.python.org/3/tutorial/", type: docs}
    - {title: Python for Everybody, provider: py4e.com, url: "https://www.py4e.com/", type: course}
  practice: Solve 20 small scripting problems and refactor one into a package with tests.
  build: A command-line tool that automates a task you actually repeat.
  prove: Public repo with a README, type hints and a passing test suite.

- id: java
  name: Java
  category: programming
  domains: [technology, engineering]
  onboarding: languages
  aliases: [jvm, spring, spring boot]
  hours: [25, 60, 70]
  description: Statically typed JVM language used widely in enterprise backends and Android.
  learn:
    - {title: Learn Java, provider: Oracle (dev.java), url: "https://dev.java/learn/", type: docs}
    - {title: Java Programming MOOC, provider: University of Helsinki, url: "https://java-programming.mooc.fi/", type: course}
  practice: Implement core data structures and a small REST service.
  build: A Spring Boot API with persistence and tests.
  prove: Repo with CI running unit and integration tests.

- id: javascript
  name: JavaScript
  category: programming
  domains: [technology, design]
  onboarding: languages
  aliases: [js, node, nodejs, node.js, es6]
  hours: [20, 50, 65]
  description: The language of the web — browsers, Node.js servers and tooling.
