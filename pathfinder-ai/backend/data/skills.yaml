    - {title: MDN Learn Web Development, provider: Mozilla, url: "https://developer.mozilla.org/en-US/docs/Learn", type: docs}
  practice: Build DOM exercises, then async data fetching with error handling.
  build: An interactive web app that consumes a public API.
  prove: Deployed app plus repo.

- id: typescript
  name: TypeScript
  category: programming
  domains: [technology]
  onboarding: languages
  aliases: [ts, tsx]
  prereqs: [javascript]
  hours: [12, 35, 40]
