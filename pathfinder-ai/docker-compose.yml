# PathFinder AI — full stack
#   docker compose up --build        → http://localhost:3000
name: pathfinder-ai

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg2://pathfinder:pathfinder@postgres:5432/pathfinder
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_EAGER: "false"
  QDRANT_URL: http://qdrant:6333
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-pathfinder-graph}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  CORS_ORIGINS: '["${FRONTEND_URL:-http://localhost:3000}"]'
  OAUTH_REDIRECT_URL: ${FRONTEND_URL:-http://localhost:3000}/api/v1/auth/oauth/google/callback
  UPLOAD_DIR: /app/uploads

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathfinder
      POSTGRES_PASSWORD: pathfinder
      POSTGRES_DB: pathfinder
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathfinder"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrantdata:/qdrant/storage]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-pathfinder-graph}
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment: *api-env
    volumes: [uploads:/app/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
      neo4j: { condition: service_healthy }
    ports: ["8000:8000"]

  worker:
    build: ./backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - path: .env
        required: false
    environment: *api-env
    volumes: [uploads:/app/uploads]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://api:8000" }
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]

volumes:
  pgdata: {}
  redisdata: {}
  qdrantdata: {}
  neo4jdata: {}
  uploads: {}
